<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detector Semne de Circulatie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="heading">
          <h1>Detector Semne de Circulație</h1>
          <span class="pill">Inferență live</span>
        </div>
        <p>Încarcă o imagine cu un semn de circulație și obține eticheta prezisă de modelul curent.</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="/upload" enctype="multipart/form-data">
          <label for="image">Selectează imagine</label>
          <input type="file" id="image" name="image" accept="image/*" required>
          <button type="submit">Încarcă și prezice</button>
        </form>
        <div class="note">Sugestie: poți folosi imagini din setul de test pentru o verificare rapidă.</div>
      </div>
    </div>
  </body>
</html>
