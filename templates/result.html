<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rezultat Predicție</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="wrapper">
      <div class="header">
        <h1>Rezultat Predicție</h1>
        <span class="pill">Inferență</span>
      </div>
      <div class="body">
        {% if filename %}
        <div class="thumb">
          <img src="/uploads/{{ filename }}" alt="uploaded">
        </div>
        <div class="meta">
          <div class="label">{{ label }}</div>
          <div class="muted">Etichetă prezisă</div>
          <div class="confidence-wrap">
            <div class="muted">Încredere</div>
            <div class="bar">
              <span style="width: {{ confidence|replace('%','') }};"></span>
            </div>
            <div style="margin-top:6px; font-weight:600;">{{ confidence }}</div>
          </div>
        </div>
        {% endif %}
      </div>
      <div class="actions">
        <a class="btn primary" href="/">Încarcă altă imagine</a>
      </div>
    </div>
  </body>
</html>
